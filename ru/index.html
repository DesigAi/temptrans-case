<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Разбор кейса TempTrans: исследование, обновление сайта и визуальная система для транспортной компании.">
    <meta name="theme-color" content="#111111">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="Разбор кейса TempTrans">
    <meta property="og:description" content="Как исследование, структура и новый визуал помогли превратить устаревший сайт в современный бизнес-инструмент.">
    <meta property="og:url" content="https://desigai.github.io/temptrans-case/ru/">
    <meta property="og:image" content="https://desigai.github.io/temptrans-case/ru/preview.jpg">
    <meta property="og:image:width" content="1500">
    <meta property="og:image:height" content="844">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Разбор кейса TempTrans">
    <meta name="twitter:description" content="Исследование, структура и новый визуал для транспортной компании.">
    <meta name="twitter:image" content="https://desigai.github.io/temptrans-case/ru/preview.jpg">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" sizes="180x180">
    <title>Разбор кейса TempTrans</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      body { background: #111; font-family: Arial, sans-serif; }
      .desktop-pdf { width: 100%; height: 100%; border: 0; display: block; }
      .mobile-case { display: none; }

      @media (max-width: 767px) {
        body { background: #f1f3f5; }
        .desktop-pdf { display: none; }
        .mobile-case { display: block; min-height: 100%; padding: 18px 14px 34px; box-sizing: border-box; }
        .mobile-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 0 auto 14px; max-width: 720px; }
        .mobile-header h1 { margin: 0; color: #111; font-size: 21px; line-height: 1.12; letter-spacing: -.02em; }
        .pdf-link { flex: 0 0 auto; margin-top: 2px; padding: 10px 12px; border-radius: 8px; background: #1674d1; color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .author-card { display: flex; align-items: center; gap: 11px; margin: 0 auto 14px; max-width: 720px; padding: 11px 12px; border: 1px solid #d8dde3; border-radius: 10px; background: #fff; box-shadow: 0 3px 10px rgba(20, 29, 38, .06); }
        .author-photo { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%; object-fit: cover; }
        .author-details { display: grid; gap: 2px; min-width: 0; }
        .author-name { color: #111; font-size: 16px; font-weight: 700; }
        .author-meta { color: #5c6370; font-size: 14px; line-height: 1.3; }
        .mobile-note { margin: 0 auto 14px; max-width: 720px; color: #5c6370; font-size: 14px; line-height: 1.4; }
        .slides { display: grid; gap: 14px; margin: 0 auto; max-width: 720px; }
        .slide-thumb { appearance: none; display: block; width: 100%; padding: 0; overflow: hidden; background: #111; border: 1px solid #d8dde3; border-radius: 10px; box-shadow: 0 4px 14px rgba(20, 29, 38, .12); cursor: pointer; }
        .slide-thumb img { display: block; width: 100%; height: auto; }
        .slide-thumb:focus-visible, .viewer button:focus-visible { outline: 3px solid #3b9cff; outline-offset: 3px; }
        .slide-number { display: block; padding: 8px 10px; background: #fff; color: #4f5967; text-align: left; font-size: 12px; font-weight: 700; }
        .viewer[hidden] { display: none; }
        .viewer { position: fixed; z-index: 10; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 76px 18px 118px; background: rgba(0, 0, 0, .96); }
        .viewer-image { display: block; max-width: 100%; max-height: calc(100dvh - 194px); object-fit: contain; }
        .viewer-close { position: absolute; z-index: 1; display: grid; place-items: center; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .16); color: #fff; font-size: 34px; cursor: pointer; }
        .viewer-close { top: 16px; right: 16px; font-size: 28px; }
        .viewer-navigation { position: absolute; right: 18px; bottom: 22px; left: 18px; display: grid; grid-template-columns: 72px 1fr 72px; align-items: end; }
        .viewer-prev, .viewer-next { display: grid; place-items: center; width: 72px; height: 72px; padding: 0; border: 1px solid rgba(255, 255, 255, .5); border-radius: 10px; background: #1674d1; color: #fff; font-size: 44px; line-height: 1; cursor: pointer; }
        .viewer-prev:disabled, .viewer-next:disabled { border-color: rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .25); cursor: default; }
        .viewer-next { justify-self: end; }
        .viewer-count { justify-self: center; align-self: end; margin-bottom: 13px; color: #fff; font-size: 15px; font-weight: 700; }
      }
    </style>
  </head>
  <body>
    <iframe class="desktop-pdf" src="./temptrans-case-ru.pdf" title="Разбор кейса TempTrans"></iframe>

    <main class="mobile-case" aria-label="Результат работы с TempTrans">
      <header class="mobile-header">
        <h1>Результат моей работы с&nbsp;логистической компанией TempTrans</h1>
        <a class="pdf-link" href="./temptrans-case-ru.pdf" target="_blank" rel="noopener">Открыть PDF</a>
      </header>
      <section class="author-card" aria-label="Об авторе работы">
        <img class="author-photo" src="./assets/ilya-kosik.png" alt="Илья Косик">
        <div class="author-details">
          <strong class="author-name">Илья Косик</strong>
          <span class="author-meta">Разработка сайтов для бизнеса&nbsp;·&nbsp;6&nbsp;лет практического опыта&nbsp;·&nbsp;B2B и&nbsp;сложные продукты</span>
        </div>
      </section>
      <p class="mobile-note">Нажмите на&nbsp;слайд, чтобы открыть его крупно и&nbsp;листать презентацию.</p>
      <section class="slides" id="slides" aria-label="Слайды презентации"></section>
    </main>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Просмотр слайдов">
      <button class="viewer-close" type="button" aria-label="Закрыть просмотр">×</button>
      <img class="viewer-image" id="viewer-image" alt="">
      <div class="viewer-navigation" aria-label="Навигация по слайдам">
        <button class="viewer-prev" type="button" aria-label="Предыдущий слайд">‹</button>
        <output class="viewer-count" id="viewer-count"></output>
        <button class="viewer-next" type="button" aria-label="Следующий слайд">›</button>
      </div>
    </div>

    <script>
      const slides = Array.from({ length: 10 }, (_, index) => `slides/slide-${String(index + 1).padStart(2, '0')}.png`);
      const slidesElement = document.getElementById('slides');
      const viewer = document.getElementById('viewer');
      const viewerImage = document.getElementById('viewer-image');
      const viewerCount = document.getElementById('viewer-count');
      const closeButton = viewer.querySelector('.viewer-close');
      const previousButton = viewer.querySelector('.viewer-prev');
      const nextButton = viewer.querySelector('.viewer-next');
      let activeIndex = 0;
      let touchStartX = 0;

      slides.forEach((source, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'slide-thumb';
        button.setAttribute('aria-label', `Открыть слайд ${index + 1}`);
        button.innerHTML = `<img src="${source}" alt="Слайд ${index + 1} презентации TempTrans" loading="lazy"><span class="slide-number">Слайд ${index + 1} из&nbsp;${slides.length}</span>`;
        button.addEventListener('click', () => openViewer(index));
        slidesElement.appendChild(button);
      });

      function showSlide(index) {
        activeIndex = Math.max(0, Math.min(index, slides.length - 1));
        viewerImage.src = slides[activeIndex];
        viewerImage.alt = `Слайд ${activeIndex + 1} презентации TempTrans`;
        viewerCount.textContent = `${activeIndex + 1} / ${slides.length}`;
        previousButton.disabled = activeIndex === 0;
        nextButton.disabled = activeIndex === slides.length - 1;
      }

      function openViewer(index) {
        showSlide(index);
        viewer.hidden = false;
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }

      function closeViewer() {
        viewer.hidden = true;
        document.body.style.overflow = '';
      }

      closeButton.addEventListener('click', closeViewer);
      previousButton.addEventListener('click', () => showSlide(activeIndex - 1));
      nextButton.addEventListener('click', () => showSlide(activeIndex + 1));
      viewer.addEventListener('click', (event) => { if (event.target === viewer) closeViewer(); });
      viewer.addEventListener('touchstart', (event) => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
      viewer.addEventListener('touchend', (event) => {
        const distance = event.changedTouches[0].screenX - touchStartX;
        if (Math.abs(distance) < 45) return;
        showSlide(activeIndex + (distance < 0 ? 1 : -1));
      }, { passive: true });
      document.addEventListener('keydown', (event) => {
        if (viewer.hidden) return;
        if (event.key === 'Escape') closeViewer();
        if (event.key === 'ArrowLeft') showSlide(activeIndex - 1);
        if (event.key === 'ArrowRight') showSlide(activeIndex + 1);
      });
    </script>
  </body>
</html>
